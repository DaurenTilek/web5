<main>
    <h2>Events</h2>

    <section>
        <h3>Task 5. Mouse Events</h3>

        <div id="mouseBox" class="box">
            Move your mouse over this box.
        </div>
    </section>

    <section>
        <h3>Task 6. Keyboard Events</h3>

        <label for="textInput">Type something:</label>
        <input id="textInput" type="text">

        <p>Current value: <span id="currentValue"></span></p>
    </section>

    <section>
        <h3>Task 7. Calculator</h3>

        <form id="calculator">
            <label for="firstNumber">First number</label>
            <input id="firstNumber" type="number" step="any" required>

            <label for="operation">Operation</label>
            <select id="operation">
                <option value="+">Addition (+)</option>
                <option value="-">Subtraction (-)</option>
                <option value="*">Multiplication (*)</option>
                <option value="/">Division (/)</option>
            </select>

            <label for="secondNumber">Second number</label>
            <input id="secondNumber" type="number" step="any" required>

            <button type="submit">Calculate</button>
        </form>

        <p id="result" aria-live="polite">Result: —</p>
    </section>
</main>

</body>
